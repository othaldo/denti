name: Deploy Denti Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and export Godot Web build
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install test dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libfontconfig1 python3

      - name: Prepare Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -R /root/.local/share/godot/export_templates/4.7.2.stable \
            "$HOME/.local/share/godot/export_templates/4.7.2.stable"

      - name: Show Godot version
        run: godot --version

      - name: Stamp build metadata
        run: |
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          sed -i "s/^build=\"dev\"$/build=\"$SHORT_SHA\"/" project.godot
          echo "Denti build: $SHORT_SHA"

      - name: Import project assets
        run: godot --headless --path . --editor --quit

      - name: Run test suite
        run: |
          python3 -m unittest discover -s tools/tests -v
          python3 tools/run_tests.py --godot godot --jobs 4

      - name: Upload test logs and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-test-results
          path: |
            .godot/test_results.json
            .godot/test_runs/**/*.log
            .godot/test_runs/**/results.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --verbose --path . --export-release "Web" build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
