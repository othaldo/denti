name: Deploy Denti Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and export Godot Web build
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install fontconfig for headless Godot
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libfontconfig1

      - name: Prepare Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -R /root/.local/share/godot/export_templates/4.7.2.stable \
            "$HOME/.local/share/godot/export_templates/4.7.2.stable"

      - name: Show Godot version
        run: godot --version

      - name: Stamp build metadata
        run: |
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          sed -i "s/^build=\"dev\"$/build=\"$SHORT_SHA\"/" project.godot
          echo "Denti build: $SHORT_SHA"

      - name: Import project assets
        run: godot --headless --path . --editor --quit

      - name: Run test suite
        run: |
          for test in tests/*.gd; do
            echo "Running $test"
            if ! godot --headless --fixed-fps 60 --path . --script "res://$test" > /tmp/denti-test.log 2>&1; then
              cat /tmp/denti-test.log
              exit 1
            fi
            cat /tmp/denti-test.log
            if grep -q "SCRIPT ERROR:" /tmp/denti-test.log; then
              exit 1
            fi
          done

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --verbose --path . --export-release "Web" build/web/index.html

      - name: Upload reusable Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: denti-web
          path: build/web
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-vercel:
    name: Deploy to Vercel
    needs: build
    runs-on: ubuntu-24.04
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check Vercel configuration
        id: vercel-config
        shell: bash
        run: |
          if [[ -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" && -n "$VERCEL_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Vercel deployment skipped: add VERCEL_ORG_ID, VERCEL_PROJECT_ID and VERCEL_TOKEN as GitHub Actions secrets."
          fi

      - name: Download Web artifact
        if: steps.vercel-config.outputs.configured == 'true'
        uses: actions/download-artifact@v5
        with:
          name: denti-web
          path: .vercel/output/static

      - name: Prepare Vercel Build Output API
        if: steps.vercel-config.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p .vercel/output
          printf '%s\n' '{"version":3}' > .vercel/output/config.json

      - name: Install Vercel CLI
        if: steps.vercel-config.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Deploy production build to Vercel
        if: steps.vercel-config.outputs.configured == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
