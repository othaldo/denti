name: Publish stable Denti Web

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-deployment:
    name: Queue published release on main
    if: github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run publish-release.yml --ref main

  deploy:
    name: Publish the latest stable release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: denti-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Compose published release and latest test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/prepare_pages.py --require-stable
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
