name: Publish Denti branch previews
run-name: ${{ github.event.workflow_run.head_branch && format('Preview {0} · Build {1}', github.event.workflow_run.head_branch, github.event.workflow_run.run_number) || 'Refresh Denti branch previews' }}

on:
  workflow_run:
    workflows: [Build Denti]
    types: [completed]
    branches: [feat, 'feat/**', 'feat-*', feature, 'feature/**', 'feature-*']
  workflow_dispatch:
  delete:

permissions:
  contents: read

jobs:
  deploy:
    name: Publish successful feature builds
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'delete' && github.event.ref_type == 'branch' &&
       (github.event.ref == 'feat' || startsWith(github.event.ref, 'feat/') || startsWith(github.event.ref, 'feat-') ||
        github.event.ref == 'feature' || startsWith(github.event.ref, 'feature/') || startsWith(github.event.ref, 'feature-'))) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: denti-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    steps:
      # Deployment code and Pages permissions always come from main.
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Compose stable, main and feature builds
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN: ${{ github.event.workflow_run.id }}
        run: |
          if [ -n "$PREVIEW_RUN" ]; then
            python3 tools/prepare_pages.py --preview-run "$PREVIEW_RUN"
          else
            python3 tools/prepare_pages.py
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
