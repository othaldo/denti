name: Publish Denti Pages
description: Upload the composed site and publish it once its artifact is visible
outputs:
  page_url:
    description: URL of the deployed Pages site
    value: ${{ steps.deploy.outputs.page_url }}
runs:
  using: composite
  steps:
    - uses: actions/upload-pages-artifact@v4
      id: upload
      with:
        name: github-pages-${{ github.run_attempt }}
        path: build/site
    - name: Wait for Pages artifact metadata
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
      run: |
        : "${PAGES_ARTIFACT_ID:?Pages upload did not return an artifact ID}"
        # The upload can be finalized before the artifact appears in run listings.
        for delay in 2 3 5 8 13; do
          sleep "$delay"
          if visible_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            -f "name=$PAGES_ARTIFACT_NAME" --jq '.artifacts[] | select(.expired == false) | .id') &&
            [[ "$visible_id" == "$PAGES_ARTIFACT_ID" ]]; then
            echo "Pages artifact $PAGES_ARTIFACT_ID is visible."
            exit 0
          fi
        done
        echo "::error::Pages artifact $PAGES_ARTIFACT_ID ($PAGES_ARTIFACT_NAME) did not appear in the workflow run."
        exit 1
    - uses: actions/deploy-pages@v5
      id: deploy
      with:
        artifact_name: github-pages-${{ github.run_attempt }}
