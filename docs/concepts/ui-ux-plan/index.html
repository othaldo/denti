#denti-run-study{--ds-bg:#19151f;--ds-surface:#25212d;--ds-raised:#322c3b;--ds-line:#4a4053;--ds-ink:#fff4df;--ds-muted:#c5b9cb;--ds-gold:#f4c56b;--ds-mint:#9adfc7;font-family:DentiStudy,system-ui,sans-serif;font-size:16px;line-height:1.4;color:var(--ds-ink)}
#denti-run-study *{box-sizing:border-box}
#denti-run-study [hidden]{display:none!important}
#denti-run-study button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#denti-run-study button:focus-visible{outline:2px solid var(--ds-ink);outline-offset:4px}
#denti-run-study button:disabled{cursor:default}
#denti-run-study .ds-product{container-type:inline-size;width:100%;max-width:100%;margin:0 auto;background:var(--ds-bg);border-radius:12px}
#denti-run-study .ds-shell{position:relative;min-height:540px;padding:26px 34px 24px;overflow:hidden;background:radial-gradient(ellipse at 50% 34%,#32243a80,transparent 70%);border-radius:12px}
#denti-run-study .ds-header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-right:86px;min-height:60px}
#denti-run-study .ds-brand{display:flex;align-items:center;gap:10px;letter-spacing:.1em;font-weight:500}
#denti-run-study .ds-logo{width:42px;height:48px;object-fit:contain}
#denti-run-study .ds-steps{display:flex;align-items:center;gap:14px;color:var(--ds-muted)}
#denti-run-study .ds-steps button{border:0;background:none;padding:10px 0;border-bottom:2px solid transparent;color:var(--ds-muted)}
#denti-run-study .ds-steps button[aria-current=step]{color:var(--ds-ink);border-bottom-color:var(--ds-gold)}
#denti-run-study .ds-steps button:disabled{opacity:.5}
#denti-run-study .ds-content{padding:32px 0 34px;min-height:394px;display:flex;align-items:center}
#denti-run-study .ds-difficulties{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;width:100%}
#denti-run-study .ds-tier{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:286px;padding:12px 10px 24px;background:linear-gradient(160deg,#352b3e,#25212d 80%);border:1px solid var(--ds-line);border-radius:22px;transition:border-color .15s,background .15s}
#denti-run-study .ds-tier[aria-pressed=true]{border:2px solid var(--ds-gold);background:linear-gradient(160deg,#4a3545,#2c2434 80%)}
#denti-run-study .ds-tier-name{font-size:24px;font-weight:500}
#denti-run-study .ds-check{position:absolute;right:13px;top:12px;color:var(--ds-gold);font-size:19px}
#denti-run-study .ds-tier[aria-pressed=false] .ds-check{visibility:hidden}
#denti-run-study .ds-scene{position:relative;width:100%;height:160px;isolation:isolate}

      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
