<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charge-Telegraph · Aufladekurven</title>
<style>
:root{--bg:#f2eff5;--panel:#fff;--line:#ddd7e6;--tx:#231f2e;--mut:#6c657d;--ac:#c85f0c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1923;--panel:#25222f;--line:#3a3648;--tx:#ece8f2;--mut:#a39db3;--ac:#ffa75a}}
:root[data-theme="dark"]{--bg:#1b1923;--panel:#25222f;--line:#3a3648;--tx:#ece8f2;--mut:#a39db3;--ac:#ffa75a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Trebuchet MS",system-ui,sans-serif}
.wrap{max-width:800px;margin:0 auto;padding:16px}
h1{font-size:19px;margin:0 0 12px;font-weight:600}
canvas{width:100%;height:auto;display:block;border-radius:6px;border:1px solid var(--line);background:#777}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center}
button,select{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
label.ck{display:flex;gap:6px;align-items:center;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 18px}
.row{display:flex;flex-direction:column;gap:2px}
.row span{display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
.row b{color:var(--tx);font-weight:600}
input[type=range]{width:100%;accent-color:var(--ac)}
pre{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;font-size:12px;margin-top:14px}

['blend','corner','shape','curve'].forEach(k=>document.getElementById('i_'+k).value=S[k]);
document.getElementById('i_power').disabled=S.curve!=='accelerate';
document.getElementById('out').textContent=JSON.stringify(S,null,1)}
ctl.prepend(document.getElementById('i_curve').parentElement);
sync();
const L={x:150,y:345,w:600,h:150};
const col=(h,l,a)=>`hsla(${h},100%,${l}%,${a})`;
function geo(){const t=S.shape;
if(t==='lane')return{t,ox:L.x,oy:L.y+L.h/2,r0:0,r1:L.w};
if(t==='circle')return{t,ox:435,oy:420,r0:0,r1:250};
if(t==='ring')return{t,ox:435,oy:420,r0:300*(1-S.ring/100),r1:300};
const half=S.angle*Math.PI/360;return{t,ox:130,oy:420,r0:0,r1:Math.min(520,380/Math.sin(half)),half}}
function shape(g){c.beginPath();const t=g.t;
if(t==='lane'){const{x,y,w,h}=L,k=S.corner==='chamfer'?18:0;c.moveTo(x+k,y);c.lineTo(x+w-k,y);c.lineTo(x+w,y+k);c.lineTo(x+w,y+h-k);c.lineTo(x+w-k,y+h);c.lineTo(x+k,y+h);c.lineTo(x,y+h-k);c.lineTo(x,y+k);c.closePath()}
else if(t==='circle')c.arc(g.ox,g.oy,g.r1,0,7);
else if(t==='ring'){c.arc(g.ox,g.oy,g.r1,0,7);c.moveTo(g.ox+g.r0,g.oy);c.arc(g.ox,g.oy,g.r0,0,7,true)}
else{c.moveTo(g.ox,g.oy);c.arc(g.ox,g.oy,g.r1,-g.half,g.half);c.closePath()}}
let T=0,running=true,last=performance.now();
const TAIL=1.13;
// A visual fill curve only: release time and urgency remain tied to elapsed time.
function chargeCurve(t){t=Math.max(0,Math.min(1,t));if(S.curve==='accelerate')return Math.pow(t,S.power);if(S.curve==='smooth')return t*t*(3-2*t);return t}
const scrub=document.getElementById('scrub'),phase=document.getElementById('phase');
scrub.addEventListener('input',()=>{running=false;T=Number(scrub.value)*S.dur;document.getElementById('pause').textContent='Weiter';draw()});

function draw(){
const g=geo(),rad=g.t!=='lane';
const time=Math.max(0,Math.min(1,T/S.dur)),p=chargeCurve(time),after=T-S.dur;
scrub.value=time;phase.textContent=after>0.53?'Bereit':after>=0?'Charge':'Zeit '+Math.round(time*100)+' % · Füllung '+Math.round(p*100)+' %';
const flash=after>=0?Math.max(0,1-after/0.18):0;
const fade=after>0.18?Math.min(1,(after-0.18)/0.35):0;
main.clearRect(0,0,W,H);if(bg.complete)main.drawImage(bg,0,0,W,H);
c=lc;c.clearRect(0,0,W,H);c.save();
shape(g);c.fillStyle=col(S.hue,60,S.tint/100);c.fill();
const rf=g.r0+(g.r1-g.r0)*p,fx=g.ox+rf,a=S.fill/100*(1+flash*0.8);
const reg=()=>{c.beginPath();if(rad)c.arc(g.ox,g.oy,rf,0,7);else c.rect(L.x,L.y,rf,L.h)};
c.save();shape(g);c.clip();
reg();c.fillStyle=col(S.hue,55,Math.min(1,a*0.6));c.fill();
if(S.front>0&&p>0){const fw=Math.min(S.front*2,rf-g.r0);
const gr=rad?c.createRadialGradient(g.ox,g.oy,rf-fw,g.ox,g.oy,rf):c.createLinearGradient(fx-fw,0,fx,0);
gr.addColorStop(0,col(S.hue,70,0));gr.addColorStop(1,col(S.hue,70,Math.min(1,a)));reg();c.fillStyle=gr;c.fill()}
if(S.chev>0&&p>0){c.save();reg();c.clip();c.strokeStyle=`rgba(255,236,212,${S.chev/100*0.55})`;c.lineWidth=4;c.lineJoin='miter';const sp=70,off=(T*70)%sp;
if(g.t==='circle'||g.t==='ring'){for(let r=g.r0+off;r<rf;r+=sp){c.beginPath();c.arc(g.ox,g.oy,r,0,7);c.stroke()}}
else{for(let x=off-sp;x<rf;x+=sp){const hh=g.t==='lane'?L.h*0.28:Math.max(8,Math.tan(Math.min(g.half,1.3))*Math.max(x,0)*0.55);
c.beginPath();c.moveTo(g.ox+x,g.oy-hh);c.lineTo(g.ox+x+26,g.oy);c.lineTo(g.ox+x,g.oy+hh);c.stroke()}}
c.restore()}
if(p>0&&p<1){c.strokeStyle=col(S.hue,88,0.9);c.lineWidth=3;c.beginPath();if(rad)c.arc(g.ox,g.oy,rf,0,7);else{c.moveTo(fx,L.y);c.lineTo(fx,L.y+L.h)}c.stroke()}
c.restore();
let pu=0,pz=S.pulse/100;
if(pz>0&&time>1-pz&&time<1){const q=(time-(1-pz))/pz;pu=(0.5+0.5*Math.sin(T*(10+25*q)))*(0.4+0.6*q)}
shape(g);c.shadowColor=col(S.hue,60,0.9);c.shadowBlur=S.glow*(1+pu*0.8+flash);
c.strokeStyle=col(S.hue,62+pu*18+flash*20,0.95);c.lineWidth=S.line*(1+pu*0.5);c.lineJoin='miter';c.stroke();
c.shadowBlur=0;c.lineWidth=Math.max(1,S.line*0.35);c.strokeStyle=`rgba(255,244,225,${0.5+pu*0.4})`;c.stroke();
if(flash>0){shape(g);c.fillStyle=`rgba(255,240,220,${flash*0.35})`;c.fill()}
c.restore();
const fs=S.fade/100*(g.r1-g.r0);
if(fs>0){c.globalCompositeOperation='destination-in';
const gm=rad?c.createRadialGradient(g.ox,g.oy,Math.max(0,g.r0-10),g.ox,g.oy,g.r0+fs):c.createLinearGradient(g.ox-10,0,g.ox+fs,0);
gm.addColorStop(0,'rgba(0,0,0,0)');gm.addColorStop(0.55,'rgba(0,0,0,0.35)');gm.addColorStop(1,'rgba(0,0,0,1)');
c.fillStyle=gm;c.fillRect(0,0,W,H);c.globalCompositeOperation='source-over'}
main.save();main.globalAlpha=1-fade;main.globalCompositeOperation=S.blend;main.drawImage(lay,0,0);main.restore();c=main;
// Platzhalter-Gegner: am Start der Bahn bzw. im Zentrum/an der Spitze
const cx=g.t==='lane'?L.x+40:g.ox,cy=g.oy;c.save();c.shadowColor=col(S.hue,60,0.9);c.shadowBlur=time*26;
c.fillStyle='#ffe6cf';c.strokeStyle='#e9a56c';c.lineWidth=3;c.beginPath();
if(c.roundRect)c.roundRect(cx-30,cy-30,60,60,12);else c.rect(cx-30,cy-30,60,60);c.fill();c.stroke();c.restore();
}
function tick(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
if(running){T+=dt*(document.getElementById('slow').checked?0.35:1);
if(T>S.dur+TAIL){if(document.getElementById('loop').checked)T=0;else T=S.dur+TAIL}}
draw();requestAnimationFrame(tick)}
requestAnimationFrame(tick);
document.getElementById('restart').onclick=()=>{T=0;running=true;document.getElementById('pause').textContent='Pause'};
document.getElementById('pause').onclick=e=>{running=!running;e.target.textContent=running?'Pause':'Weiter'};
document.getElementById('pNew').onclick=()=>{S={...S,...NEW};sync();T=0};
document.getElementById('pOld').onclick=()=>{S={...S,...OLD};sync();T=0};
</script></body></html>
